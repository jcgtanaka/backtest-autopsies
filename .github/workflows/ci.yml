name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - run: python tools/publish_gate.py

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,notebooks]"
      - name: Execute every case notebook in synthetic mode
        run: |
          out="$(mktemp -d)"
          for nb in cases/*/notebook.ipynb; do
            AUTOPSY_SYNTHETIC=1 jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir "$out" --output "$(basename "$(dirname "$nb")").ipynb"
          done
